<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpak AI - DSA Mock Interviewer</title>
    <!-- Connects to  CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <div class="header">
        <!-- Modern SVG Robot Logo -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: -4px;">
            <path d="M12 8V4H8"/>
            <rect width="16" height="12" x="4" y="8" rx="2"/>
            <path d="M2 14h2"/>
            <path d="M20 14h2"/>
            <path d="M15 13v2"/>
            <path d="M9 13v2"/>
        </svg>
        <span>Helpak AI </span>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message bot">Welcome! I am Helpak AI, your technical mock interviewer. What Data Structures or Algorithms topic would you like to build confidence in today?</div>
    </div>
    <div class="input-area">
        <!-- Floating pill-shaped input -->
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Type your algorithmic approach or response here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<!-- Connects to  JavaScript file -->
<script src="script.js"></script>

</body>
</html>
